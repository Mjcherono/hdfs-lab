# Cluster-wide Spark defaults, read by every spark-submit and by the History
# Server. Per-job sizing (executors, memory) stays in each job's launch script.

# Production mode: run on YARN, with the driver inside the cluster too.
spark.master                            yarn
spark.submit.deployMode                 cluster

# Spark's own libraries, uploaded to HDFS once (ops/bootstrap_cluster.sh) instead
# of about 320 MB from the client on every run.
spark.yarn.archive                      hdfs://namenode:8020/apps/spark/spark-libs-3.5.3.zip

# Python on the worker image, for the driver and executors.
spark.pyspark.python                    /opt/python/bin/python3
spark.yarn.appMasterEnv.PYSPARK_PYTHON  /opt/python/bin/python3
spark.executorEnv.PYSPARK_PYTHON        /opt/python/bin/python3

# Event logs for the History Server, so finished jobs can be inspected.
spark.eventLog.enabled                  true
spark.eventLog.dir                      hdfs://namenode:8020/spark-history
spark.history.fs.logDirectory           hdfs://namenode:8020/spark-history
spark.yarn.historyServer.address        localhost:18080

spark.sql.session.timeZone              UTC
